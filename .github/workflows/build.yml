name: Build

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Exact draft release tag to build and publish
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: bun run lint
      - name: Typecheck
        working-directory: frontend
        run: bun run typecheck
      - name: Test
        working-directory: frontend
        run: bun run test
      - name: Build
        working-directory: frontend
        run: bun run build
      - uses: actions/upload-artifact@v5
        with:
          name: static
          path: static

  test:
    name: Rust checks
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: actions/download-artifact@v5
        with:
          name: static
          path: static
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  binaries:
    name: ${{ matrix.name }}
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kirolb-windows-x64.exe
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: kirolb.exe
          - name: kirolb-windows-arm64.exe
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bin: kirolb.exe
          - name: kirolb-linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: kirolb
            musl: true
          - name: kirolb-linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            bin: kirolb
            musl: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: actions/download-artifact@v5
        with:
          name: static
          path: static
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Rename
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.name }}"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    name: Release
    if: inputs.release_tag != '' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: [test, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      - name: Validate version and refuse published releases
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$TAG" = "v$version"
          if gh release view "$TAG" --json isDraft --jq .isDraft > draft-status; then
            test "$(cat draft-status)" = true || { echo 'Refusing to overwrite a published release'; exit 1; }
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes
          fi
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: kirolb-*
          merge-multiple: true
      - name: Package
        working-directory: dist
        run: |
          for f in kirolb-linux-x64 kirolb-linux-arm64 kirolb-windows-x64.exe kirolb-windows-arm64.exe; do
            test -s "$f"
          done
          for f in kirolb-linux-*; do
            chmod 0755 "$f"
            cp "$GITHUB_WORKSPACE/assets/kirolb.svg" .
            tar -czf "$f.tar.gz" "$f" kirolb.svg
            rm "$f" kirolb.svg
          done
          sha256sum kirolb-* > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Upload, verify downloads, then publish
        run: |
          gh release upload "$TAG" dist/* --clobber
          gh release download "$TAG" --dir downloaded
          cmp dist/SHA256SUMS downloaded/SHA256SUMS
          (cd downloaded && sha256sum -c SHA256SUMS)
          gh release edit "$TAG" --draft=false --latest

  docker:
    name: Docker image
    # Dispatch is validation-only. The called release workflow publishes binaries only.
    if: github.event_name == 'push' && inputs.release_tag == ''
    needs: [test, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: kirolb-linux-*
          merge-multiple: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
