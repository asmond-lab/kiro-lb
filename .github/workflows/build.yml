name: Build

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: bun run lint
      - name: Typecheck
        working-directory: frontend
        run: bun run typecheck
      - name: Test
        working-directory: frontend
        run: bun run test
      - name: Build
        working-directory: frontend
        run: bun run build
      - uses: actions/upload-artifact@v5
        with:
          name: static
          path: static

  test:
    name: Rust checks
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: static
          path: static
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  binaries:
    name: ${{ matrix.name }}
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kirolb-windows-x64.exe
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: kirolb.exe
          - name: kirolb-windows-arm64.exe
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bin: kirolb.exe
          - name: kirolb-linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: kirolb
            musl: true
          - name: kirolb-linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            bin: kirolb
            musl: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: static
          path: static
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Rename
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.name }}"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: kirolb-*
          merge-multiple: true
      - name: Package
        working-directory: dist
        run: |
          for f in kirolb-linux-*; do
            chmod 0755 "$f"
            cp "$GITHUB_WORKSPACE/assets/kirolb.svg" .
            tar -czf "$f.tar.gz" "$f" kirolb.svg
            rm "$f" kirolb.svg
          done
          sha256sum kirolb-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  docker:
    name: Docker image
    if: github.event_name != 'pull_request'
    needs: [test, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: kirolb-linux-*
          merge-multiple: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
