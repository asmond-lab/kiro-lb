version: "3.8"

services:
  kiro-lb:
    image: ghcr.io/minpeter/kiro-lb:main
    container_name: kiro-lb
    ports:
      - "8000:8000"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - PROXY_API_KEY=${PROXY_API_KEY:?Set PROXY_API_KEY in .env}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG_MODE=${DEBUG_MODE:-off}
      - VPN_PROXY_URL=${VPN_PROXY_URL:-}
    env_file:
      - .env
    volumes:
      - ./debug_logs:/app/debug_logs
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  default:
    name: kiro-lb-network
